version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      testing:
        patterns:
          [
            'vitest',
            '@vitest/*',
            '@playwright/*',
            '@axe-core/*',
            'testcontainers',
            '@testcontainers/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/apps/api, /deploy/caddy]
    schedule:
      interval: weekly
