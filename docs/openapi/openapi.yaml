  # --- Events ------------------------------------------------------------------
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Etkinlikleri listele (havuz, takvim, arşiv)
      description: >-
        Öğrenci yalnızca `pool`, `scheduled`, `completed` ve kendi önerdiği etkinlikleri görür;
        danışman ek olarak kendi onayını bekleyenleri görür. `ETag` ile yeniden doğrulanır.
      x-roles: [student, advisor, admin]
      x-phase: 4
      parameters:
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            maxItems: 6
            items: { $ref: './components/schemas.yaml#/EventStatus' }
        - $ref: './components/parameters.yaml#/Category'
        - name: from
          in: query
          description: Bu andan sonra başlayanlar (takvim görünümü).
          schema: { $ref: './components/schemas.yaml#/Timestamp' }
        - name: to
          in: query
          schema: { $ref: './components/schemas.yaml#/Timestamp' }
        - name: mine
          in: query
          description: Yalnızca çağıranın önerdiği ya da danışmanı olduğu etkinlikler.
          schema: { type: boolean }
        - name: communityId
          in: query
          schema: { $ref: './components/schemas.yaml#/PublicId' }
        - name: tag
          in: query
          schema: { $ref: './components/schemas.yaml#/Tag' }
        - name: q
          in: query
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/IfNoneMatch'
      responses:
        '200':
          description: Etkinlikler.
          headers:
            ETag: { $ref: './components/headers.yaml#/ETag' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/EventPage' }
        '304': { $ref: './components/responses.yaml#/NotModified' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
    post:
      tags: [events]
      operationId: createEvent
      summary: Etkinlik öner
      x-roles: [student, advisor, admin]
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/EventCreate' }
      responses:
        '201':
          description: Oluşturuldu (`pending_approval` ya da `pool`).
          headers:
            Location: { $ref: './components/headers.yaml#/Location' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Event' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /events/{eventId}:
    parameters:
      - $ref: './components/parameters.yaml#/EventId'
    get:
      tags: [events]
      operationId: getEvent
      summary: Etkinlik ayrıntısı
      x-roles: [student, advisor, admin]
      x-phase: 4
      parameters:
        - $ref: './components/parameters.yaml#/IfNoneMatch'
      responses:
        '200':
          description: Etkinlik.
          headers:
            ETag: { $ref: './components/headers.yaml#/ETag' }
          content:
            application/json:
