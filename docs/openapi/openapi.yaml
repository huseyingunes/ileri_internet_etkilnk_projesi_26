      responses:
        '200':
          description: Güncel etkinlik.
          headers:
            ETag: { $ref: './components/headers.yaml#/ETag' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Event' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /events/{eventId}/review:
    parameters:
      - $ref: './components/parameters.yaml#/EventId'
    put:
      tags: [events]
      operationId: reviewEvent
      summary: Öğrenci etkinliğini onayla ya da reddet
      description: Danışman yalnızca kendisine atanmış etkinlikleri inceler. Onaylanan etkinlik havuza girer.
      x-roles: [advisor, admin]
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/EventReview' }
      responses:
        '200':
          description: Güncel etkinlik.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Event' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /events/{eventId}/cancellation:
    parameters:
      - $ref: './components/parameters.yaml#/EventId'
    put:
      tags: [events]
      operationId: cancelEvent
      summary: Etkinliği iptal et
