openapi: 3.1.1
info:
  title: Etkinlik Platformu API
  version: 1.0.0-draft
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
  description: |
    Etkinlik Yönetimi ve Öğrenci Katılım Platformu REST API sözleşmesi (Aşama 2).
    Kod bu sözleşmeye göre yazılır; değişiklik önce burada yapılır.

    **Genel kurallar**
    - Tüm yollar `/api/v1` altındadır; istemci aynı origin'den çağırır, CORS yoktur.
    - Kimlik doğrulama: OIDC ile üniversite SSO, sunucu taraflı oturum, `__Host-session` çerezi.
      Yetki varsayılan olarak reddedilir; her işlemin izinli rolleri `x-roles` ile belirtilir.
      Öğrenci kimliği istekten değil oturumdan alınır.
    - Durum değiştiren isteklerde Fetch Metadata denetimi yapılır: `Sec-Fetch-Site`
      `same-origin` değilse `403`.
    - Hatalar tek gövdeyle döner (`ErrorBody`). `401` oturum yok, `403` yetki yok,
      `422` doğrulama/iş kuralı, `429` hız sınırı (`Retry-After` ile).
    - Listeler imleç tabanlı sayfalanır: `limit` (varsayılan 20, en fazla 100) ve `cursor`;
      yanıtta `page.nextCursor`.
    - Oy, başvuru ve QR okutma idempotenttir: aynı istek tekrarlanırsa aynı sonuç döner.
    - Hız sınırı olan uç noktalar `RateLimit-*` başlıklarını döner.
    - Kullanıcı metinleri düz metindir; HTML kabul edilmez.
    - `x-phase`: işlemin uygulanacağı aşama.
servers:
  - url: https://haber10da.net/api/v1
    description: Üretim
  - url: https://etkinlik.localhost/api/v1
    description: Yerel geliştirme
security:
  - session: []
tags:
  - name: health
    description: 'Liveness ve readiness'
  - name: auth
    description: 'OIDC ile giriş ve çıkış'
  - name: me
    description: 'Oturum sahibinin profili, rızaları, tercihleri ve kişisel verileri'
  - name: users
    description: 'Kullanıcı ve rol yönetimi'
  - name: communities
    description: 'Öğrenci toplulukları'
  - name: events
    description: 'Etkinlik önerisi, onay, havuz, takvim ve arşiv'
  - name: media
    description: 'Kapak görselleri ve fotoğraflar'
  - name: voting
    description: 'Günlük seçim, oylama ve sonuçlar'
  - name: applications
    description: 'Başvuru, kontenjan ve bekleme listesi'
  - name: attendance
    description: 'QR, konum ve süre ile katılım doğrulama'
  - name: scoring
    description: 'Puan kuralları, sezonlar ve liderlik tablosu'
  - name: feedback
    description: 'Neden soruları ve değerlendirmeler'
  - name: notifications
    description: "Uygulama içi bildirimler ve WhatsApp webhook'u"
  - name: admin
    description: 'Ayarlar, denetim kaydı ve analitik'

paths:
  # --- Health ----------------------------------------------------------------
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Süreç ayakta mı?
      security: []
      x-roles: [public]
      x-phase: 0
      responses:
        '200':
          description: Süreç yanıt veriyor.
          headers:
            X-Request-Id: { $ref: './components/headers.yaml#/RequestId' }
            Cache-Control: { $ref: './components/headers.yaml#/NoStore' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/HealthResponse' }
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Bağımlılıklar hazır mı?
      security: []
      x-roles: [public]
      x-phase: 0
      responses:
        '200':
          description: PostgreSQL ve Redis erişilebilir.
          headers:
            X-Request-Id: { $ref: './components/headers.yaml#/RequestId' }
            Cache-Control: { $ref: './components/headers.yaml#/NoStore' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/HealthResponse' }
        '503':
          description: En az bir bağımlılık hazır değil.
          headers:
            X-Request-Id: { $ref: './components/headers.yaml#/RequestId' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/HealthResponse' }

  # --- Auth ------------------------------------------------------------------
  /auth/login:
    get:
      tags: [auth]
      operationId: startLogin
      summary: Üniversite SSO girişini başlat
      description: >-
        Kimlik sağlayıcıya (OIDC, PKCE) yönlendirir. `returnTo` yalnızca `/` ile başlayan
        göreli bir yol olabilir (açık yönlendirme yok). Hız sınırlıdır.
      security: []
      x-roles: [public]
      x-phase: 3
      parameters:
        - name: returnTo
          in: query
          schema: { type: string, pattern: '^/(?!/)[^\s]{0,500}$' }
      responses:
        '302':
          description: Kimlik sağlayıcıya yönlendirme.
          headers:
            Location: { $ref: './components/headers.yaml#/Location' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
        '429': { $ref: './components/responses.yaml#/RateLimited' }
  /auth/callback:
    get:
      tags: [auth]
      operationId: completeLogin
      summary: OIDC dönüşü (GET; form_post kullanılmaz)
      description: >-
        `state` (tarayıcıya `__Host-login-state` çereziyle bağlı ve tek kullanımlık), `nonce` ve
        PKCE doğrulanır; girişte yeni oturum kimliği üretilir (oturum sabitleme yok). İlk yönetici,
        ortam değişkenindeki kurumsal e-postayla ilk girişte atanır. Bu adres tarayıcının tam sayfa
        gezintisi olduğu için hatalar JSON yerine `/?giris=hata` adresine yönlendirilir.
      security: []
      x-roles: [public]
      x-phase: 3
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 512 } }
      responses:
        '302':
          description: >-
            Başarılıysa `returnTo` adresine, oturum çereziyle; doğrulama başarısızsa (`state` uyuşmuyor,
            süresi dolmuş, hesap devre dışı, ID token geçersiz) oturum açılmadan `/?giris=hata` adresine.
          headers:
            Location: { $ref: './components/headers.yaml#/Location' }
            Set-Cookie: { $ref: './components/headers.yaml#/SetSessionCookie' }
        '429': { $ref: './components/responses.yaml#/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Çıkış
      x-roles: [student, advisor, admin]
      x-phase: 3
      responses:
        '204':
          description: Oturum silindi.
          headers:
            Clear-Site-Data: { $ref: './components/headers.yaml#/ClearSiteData' }
            X-Request-Id: { $ref: './components/headers.yaml#/RequestId' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }

  # --- Me ----------------------------------------------------------------------
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Oturum sahibinin profili
      x-roles: [student, advisor, admin]
      x-phase: 3
      responses:
        '200':
          description: Profil. Yanıt service worker'da önbelleğe alınmaz.
          headers:
            Cache-Control: { $ref: './components/headers.yaml#/NoStore' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Me' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Profili güncelle (telefon)
      x-roles: [student, advisor, admin]
      x-phase: 3
      x-rate-limited: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/MeUpdate' }
      responses:
        '200':
          description: Güncel profil.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Me' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
        '429': { $ref: './components/responses.yaml#/RateLimited' }
  /me/consents:
    get:
      tags: [me]
      operationId: listMyConsents
      summary: Açık rıza durumları (konum, WhatsApp, fotoğraf)
      x-roles: [student, advisor, admin]
      x-phase: 3
      responses:
        '200':
          description: Her rıza türü için güncel durum.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 3
                    items: { $ref: './components/schemas.yaml#/Consent' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
  /me/consents/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: './components/schemas.yaml#/ConsentKind' }
    put:
      tags: [me]
      operationId: grantConsent
      summary: Rıza ver (idempotent)
      x-roles: [student, advisor, admin]
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/ConsentGrant' }
      responses:
        '200':
          description: Rıza kaydedildi.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Consent' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
    delete:
      tags: [me]
      operationId: revokeConsent
      summary: Rızayı geri al
      description: WhatsApp rızası geri alınınca WhatsApp bildirimleri durur; uygulama içi bildirimler sürer.
      x-roles: [student, advisor, admin]
      x-phase: 3
      responses:
        '204': { $ref: './components/responses.yaml#/NoContent' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
  /me/notification-preferences:
    get:
      tags: [me]
      operationId: getNotificationPreferences
      summary: Bildirim kanal ve tür tercihleri
      x-roles: [student, advisor, admin]
      x-phase: 10
      responses:
        '200':
          description: Tercihler.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/NotificationPreferenceList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
    put:
      tags: [me]
      operationId: replaceNotificationPreferences
      summary: Tercihleri değiştir
      x-roles: [student, advisor, admin]
      x-phase: 10
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/NotificationPreferenceList' }
      responses:
        '200':
          description: Güncel tercihler.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/NotificationPreferenceList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /me/interests:
    get:
      tags: [me]
      operationId: getMyInterests
      summary: İlgi alanları
      x-roles: [student]
      x-phase: 10
      responses:
        '200':
          description: Seçilen ve türetilen ilgi alanları.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/InterestList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
    put:
      tags: [me]
      operationId: replaceMyInterests
      summary: Seçilen ilgi alanlarını değiştir
      x-roles: [student]
      x-phase: 10
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/InterestUpdate' }
      responses:
        '200':
          description: Güncel ilgi alanları.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/InterestList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /me/score:
    get:
      tags: [me, scoring]
      operationId: getMyScore
      summary: Puan, sıra ve katılım istatistikleri (kişisel)
      x-roles: [student]
      x-phase: 8
      parameters:
        - $ref: './components/parameters.yaml#/SeasonName'
      responses:
        '200':
          description: Özet.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ScoreSummary' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
  /me/score-entries:
    get:
      tags: [me, scoring]
      operationId: listMyScoreEntries
      summary: Puan geçmişi (hangi etkinlikten kaç puan)
      x-roles: [student]
      x-phase: 8
      parameters:
        - $ref: './components/parameters.yaml#/SeasonName'
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Defter hareketleri, en yeni önce.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ScoreEntryPage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /me/applications:
    get:
      tags: [me, applications]
      operationId: listMyApplications
      summary: Başvurularım
      x-roles: [student]
      x-phase: 6
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [confirmed, waitlisted, cancelled] }
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Başvurular. Yanıt service worker'da önbelleğe alınmaz.
          headers:
            Cache-Control: { $ref: './components/headers.yaml#/NoStore' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/MyApplicationPage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /me/reason-prompts:
    get:
      tags: [me, feedback]
      operationId: listMyReasonPrompts
      summary: Bekleyen neden soruları
      x-roles: [student]
      x-phase: 9
      parameters:
        - name: answered
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Sorular.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ReasonPromptList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
  /me/notifications:
    get:
      tags: [me, notifications]
      operationId: listMyNotifications
      summary: Uygulama içi bildirimler
      description: İstemci kısa aralıklı sorgulama yapar (gerekirse SSE ile değiştirilir).
      x-roles: [student, advisor, admin]
      x-phase: 10
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Bildirimler, en yeni önce.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/NotificationPage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /me/notifications/{notificationId}:
    parameters:
      - $ref: './components/parameters.yaml#/NotificationId'
    patch:
      tags: [me, notifications]
      operationId: markNotificationRead
      summary: Okundu olarak işaretle
      x-roles: [student, advisor, admin]
      x-phase: 10
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/NotificationUpdate' }
      responses:
        '204': { $ref: './components/responses.yaml#/NoContent' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /me/data-requests:
    get:
      tags: [me]
      operationId: listMyDataRequests
      summary: '"Verilerimi indir" ve "verilerimi sil" talepleri'
      x-roles: [student, advisor, admin]
      x-phase: 12
      responses:
        '200':
          description: Talepler.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/DataRequestList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
    post:
      tags: [me]
      operationId: createDataRequest
      summary: Veri indirme ya da silme talebi oluştur
      description: >-
        İşlem worker'da yürür. Silme, kişisel verileri anonimleştirir; puan defteri ve
        denetim kaydı gibi değiştirilemez kayıtlar kişiyle ilişkisi kesilerek korunur.
        Aynı türde açık talep varsa onu döner (idempotent).
      x-roles: [student, advisor, admin]
      x-phase: 12
      x-rate-limited: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/DataRequestCreate' }
      responses:
        '200':
          description: Aynı türde açık talep zaten var.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/DataRequest' }
        '202':
          description: Talep alındı.
          headers:
            Location: { $ref: './components/headers.yaml#/Location' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/DataRequest' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
        '429': { $ref: './components/responses.yaml#/RateLimited' }

  # --- Users -------------------------------------------------------------------
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Kullanıcıları listele
      x-roles: [admin]
      x-phase: 3
      parameters:
        - name: role
          in: query
          schema: { $ref: './components/schemas.yaml#/Role' }
        - name: q
          in: query
          description: Ad ya da e-postada arama.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Kullanıcılar.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/UserPage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /users/{userId}:
    parameters:
      - $ref: './components/parameters.yaml#/UserId'
    patch:
      tags: [users]
      operationId: updateUser
      summary: Rol ata ya da hesabı devre dışı bırak (denetim kaydına yazılır)
      description: Yönetici kendi rolünü düşüremez; son yönetici devre dışı bırakılamaz (`409`).
      x-roles: [admin]
      x-phase: 3
      x-audited: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/UserAdminUpdate' }
      responses:
        '200':
          description: Güncel kullanıcı.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/UserAdminView' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }

  /advisors:
    get:
      tags: [users]
      operationId: listAdvisors
      summary: Danışmanlar (öneri formunda seçim için; yalnızca ad ve rol)
      x-roles: [student, advisor, admin]
      x-phase: 4
      responses:
        '200':
          description: Etkin danışmanlar, ada göre sıralı (en fazla 200).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items: { $ref: './components/schemas.yaml#/UserSummary' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }

  # --- Communities ------------------------------------------------------------
  /communities:
    get:
      tags: [communities]
      operationId: listCommunities
      summary: Toplulukları listele
      x-roles: [student, advisor, admin]
      x-phase: 3
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Topluluklar.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/CommunityPage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
    post:
      tags: [communities]
      operationId: createCommunity
      summary: Topluluk oluştur
      x-roles: [admin]
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/CommunityCreate' }
      responses:
        '201':
          description: Oluşturuldu.
          headers:
            Location: { $ref: './components/headers.yaml#/Location' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Community' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /communities/{communityId}:
    parameters:
      - $ref: './components/parameters.yaml#/CommunityId'
