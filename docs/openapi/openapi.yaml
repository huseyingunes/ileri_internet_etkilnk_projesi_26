  # --- Media -------------------------------------------------------------------
  /media:
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Görsel yükle
      description: >-
        Yükleme özel kovaya yazılır; worker AVIF/WebP ve birkaç boyutta türev üretir, en ve boyu
        kaydeder. Fotoğraf yüklemek için fotoğraf rızası gerekmez; galeriye eklemek danışman ve
        yöneticiye özeldir. Hız sınırlıdır.
      x-roles: [student, advisor, admin]
      x-phase: 4
      x-rate-limited: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: './components/schemas.yaml#/MediaUpload' }
      responses:
        '202':
          description: 'Alındı; türevler hazırlanıyor (`status` = `pending`).'
          headers:
            Location: { $ref: './components/headers.yaml#/Location' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Media' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '413': { $ref: './components/responses.yaml#/PayloadTooLarge' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
        '429': { $ref: './components/responses.yaml#/RateLimited' }
  /media/{mediaId}:
    parameters:
      - $ref: './components/parameters.yaml#/MediaId'
    get:
      tags: [media]
      operationId: getMedia
      summary: Görsel bilgisi ve türevleri
      x-roles: [student, advisor, admin]
      x-phase: 4
      responses:
        '200':
          description: Görsel.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Media' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
  /media/{mediaId}/variants/{variant}:
    parameters:
      - $ref: './components/parameters.yaml#/MediaId'
      - name: variant
        in: path
        required: true
        description: '`<genişlik>.<biçim>`, ör. `640.avif`.'
        schema: { type: string, pattern: '^[1-9][0-9]{1,4}\.(avif|webp|jpeg)$' }
    get:
      tags: [media]
      operationId: getMediaVariant
      summary: Görsel türevinin baytları
      description: Kovadan akıtılır; `Cache-Control` uzun ömürlüdür çünkü türevler değişmez.
      x-roles: [student, advisor, admin]
      x-phase: 4
      responses:
        '200':
