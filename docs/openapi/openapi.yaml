  /events/{eventId}/applications:
    parameters:
      - $ref: './components/parameters.yaml#/EventId'
    get:
      tags: [applications]
      operationId: listEventApplications
      summary: Başvuranlar ve bekleme listesi
      x-roles: [advisor, admin]
      x-phase: 6
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [confirmed, waitlisted, cancelled] }
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Başvurular.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ApplicationPage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
    post:
      tags: [applications]
      operationId: applyToEvent
      summary: Takvimdeki etkinliğe başvur
      description: >-
        Kontenjan transaction ve satır kilidiyle korunur; doluysa bekleme listesine alınır.
        İdempotent: aynı öğrencinin tekrar başvurusu mevcut başvuruyu `200` ile döner; iptal
        edilmiş başvuru yeniden etkinleşir. Oy vermekten bağımsızdır.
      x-roles: [student]
      x-phase: 6
      x-rate-limited: true
      x-idempotent: true
      responses:
        '200':
          description: Başvuru zaten vardı.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Application' }
        '201':
          description: Başvuru alındı (`confirmed` ya da `waitlisted`).
          headers:
            Location: { $ref: './components/headers.yaml#/Location' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Application' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '429': { $ref: './components/responses.yaml#/RateLimited' }
  /applications/{applicationId}:
    parameters:
      - $ref: './components/parameters.yaml#/ApplicationId'
    delete:
      tags: [applications]
      operationId: cancelApplication
      summary: Başvuruyu iptal et
      description: Yalnızca başvuru sahibi. Onaylı yer boşalırsa bekleme listesindeki ilk öğrenci yükseltilir ve bildirim alır. İdempotent.
      x-roles: [student]
      x-phase: 6
      x-idempotent: true
      responses:
        '204': { $ref: './components/responses.yaml#/NoContent' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }

  # --- Attendance --------------------------------------------------------------
  /events/{eventId}/qr-token:
    parameters:
      - $ref: './components/parameters.yaml#/EventId'
    get:
      tags: [attendance]
      operationId: getQrToken
      summary: Ekranda gösterilecek güncel QR
      description: >-
        20–30 saniyede bir yenilenen, sunucu imzalı, kısa ömürlü belirteç. İstemci
        `refreshAfterSeconds` sonra yeniden ister. Yalnızca etkinlik süresince.
      x-roles: [advisor, admin]
      x-phase: 7
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [entry, exit, spot_check], default: entry }
      responses:
        '200':
          description: QR içeriği.
          headers:
            Cache-Control: { $ref: './components/headers.yaml#/NoStore' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/QrToken' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
  /attendance-scans:
    post:
      tags: [attendance]
      operationId: scanAttendance
      summary: QR okut ve konumu doğrula
      description: >-
        Belirteç, oturum ve konum birlikte doğrulanır. Konum izni öğrencinin dokunuşuyla istenir
        ve konum rızası gerekir. Koordinatlar saklanmaz; yalnızca sonuç, uzaklık ve zaman tutulur.
        İdempotent: aynı belirteçle tekrar okutma aynı sonucu döner. Hız sınırlıdır.
      x-roles: [student]
      x-phase: 7
      x-rate-limited: true
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/AttendanceScanCreate' }
      responses:
        '200':
          description: Okutma sonucu (kabul ya da gerekçeli ret). Önbelleğe alınmaz.
          headers:
            Cache-Control: { $ref: './components/headers.yaml#/NoStore' }
            RateLimit-Limit: { $ref: './components/headers.yaml#/RateLimitLimit' }
            RateLimit-Remaining: { $ref: './components/headers.yaml#/RateLimitRemaining' }
            RateLimit-Reset: { $ref: './components/headers.yaml#/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/AttendanceScanResult' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403':
          description: Rol yetkisi yok ya da konum açık rızası verilmemiş.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ErrorBody' }
        '409':
          description: Öğrencinin bu etkinliğe onaylı başvurusu yok.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ErrorBody' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
        '429': { $ref: './components/responses.yaml#/RateLimited' }
  /events/{eventId}/attendances:
    parameters:
      - $ref: './components/parameters.yaml#/EventId'
    get:
      tags: [attendance]
      operationId: listEventAttendances
      summary: Katılım durumu
      x-roles: [advisor, admin]
      x-phase: 7
      parameters:
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Katılımlar.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/AttendancePage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /events/{eventId}/excuses:
    parameters:
      - $ref: './components/parameters.yaml#/EventId'
    get:
      tags: [attendance]
      operationId: listEventExcuses
      summary: Mazeretler
      x-roles: [advisor, admin]
      x-phase: 8
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Mazeretler.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ExcusePage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
    post:
      tags: [attendance]
      operationId: submitExcuse
      summary: Mazeret bildir
      description: Onaylı başvurusu olan öğrenci, etkinlik bitiminden sonraki 7 güne kadar bir kez bildirebilir; aksi hâlde 409.
      x-roles: [student]
      x-phase: 8
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/ExcuseCreate' }
      responses:
        '201':
          description: Mazeret alındı.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Excuse' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /excuses/{excuseId}:
    parameters:
      - $ref: './components/parameters.yaml#/ExcuseId'
    patch:
      tags: [attendance]
      operationId: reviewExcuse
      summary: Mazereti onayla ya da reddet
      description: Onaylanan mazerette puan düşülmez; daha önce düşüldüyse telafi hareketi yazılır.
      x-roles: [advisor, admin]
      x-phase: 8
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/ExcuseReview' }
      responses:
        '200':
          description: Güncel mazeret.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Excuse' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }

  # --- Scoring -----------------------------------------------------------------
  /score-rules:
    get:
      tags: [scoring]
      operationId: listScoreRules
      summary: Güncel puan tablosu
      x-roles: [student, advisor, admin]
      x-phase: 8
      responses:
        '200':
          description: Kurallar.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ScoreRuleList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
  /score-rules/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { $ref: './components/schemas.yaml#/ScoreRuleCode' }
    put:
      tags: [scoring]
      operationId: updateScoreRule
      summary: Puan değerini değiştir (yeni sürüm; denetim kaydına yazılır)
      description: Değişiklik yalnızca bundan sonra puanlanacak etkinlikleri etkiler.
      x-roles: [admin]
      x-phase: 8
      x-audited: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/ScoreRuleUpdate' }
      responses:
        '200':
          description: Yeni kural sürümü.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/ScoreRule' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /seasons:
    get:
      tags: [scoring]
      operationId: listSeasons
      summary: Sezonlar (akademik yıllar)
      x-roles: [student, advisor, admin]
      x-phase: 8
      responses:
        '200':
          description: Sezonlar, en yeni önce.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/SeasonList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
  /leaderboard:
    get:
      tags: [scoring]
      operationId: getLeaderboard
      summary: Liderlik tablosu (ilk 10)
      description: Geçmiş sezonlar arşivden sunulur. Öğrenciler `me` alanında kendi sırasını görür.
      x-roles: [student, advisor, admin]
      x-phase: 8
      parameters:
        - $ref: './components/parameters.yaml#/SeasonName'
        - $ref: './components/parameters.yaml#/IfNoneMatch'
      responses:
        '200':
          description: Tablo.
          headers:
            ETag: { $ref: './components/headers.yaml#/ETag' }
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Leaderboard' }
        '304': { $ref: './components/responses.yaml#/NotModified' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '404': { $ref: './components/responses.yaml#/NotFound' }

  # --- Feedback ----------------------------------------------------------------
  /reason-prompts/{reasonPromptId}/answer:
    parameters:
      - $ref: './components/parameters.yaml#/ReasonPromptId'
    put:
      tags: [feedback]
      operationId: answerReasonPrompt
      summary: Neden sorusunu yanıtla (tek, açık uçlu)
      x-roles: [student]
      x-phase: 9
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/ReasonAnswer' }
      responses:
        '204': { $ref: './components/responses.yaml#/NoContent' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /events/{eventId}/ratings:
    parameters:
      - $ref: './components/parameters.yaml#/EventId'
    get:
      tags: [feedback]
      operationId: getEventRatings
      summary: Ortalama puan ve yorumlar
      x-roles: [advisor, admin]
      x-phase: 9
      parameters:
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Değerlendirmeler.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/RatingReport' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
    post:
      tags: [feedback]
      operationId: rateEvent
      summary: Etkinliği değerlendir (1–5 ve yorum)
      description: Yalnızca katılımı doğrulanan öğrenci, bir kez.
      x-roles: [student]
      x-phase: 9
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/RatingCreate' }
      responses:
        '201':
          description: Değerlendirme kaydedildi.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Rating' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '404': { $ref: './components/responses.yaml#/NotFound' }
        '409': { $ref: './components/responses.yaml#/Conflict' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }

  # --- Notifications (webhook) ------------------------------------------------
  /webhooks/whatsapp:
    get:
      tags: [notifications]
      operationId: verifyWhatsappWebhook
      summary: Meta webhook doğrulama
      description: '`hub.verify_token` sabit zamanlı karşılaştırmayla doğrulanır. WhatsApp yapılandırılmamışsa 403.'
      security: []
      x-roles: [public]
      x-phase: 10
      parameters:
        - { name: hub.mode, in: query, required: true, schema: { type: string, const: subscribe } }
        - {
            name: hub.verify_token,
            in: query,
            required: true,
            schema: { type: string, maxLength: 256 },
          }
        - {
            name: hub.challenge,
            in: query,
            required: true,
            schema: { type: string, pattern: '^[0-9]{1,15}$' },
          }
      responses:
        '200':
          description: '`hub.challenge` düz metin olarak döner.'
          content:
            text/plain:
              schema: { type: string }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
    post:
      tags: [notifications]
      operationId: receiveWhatsappWebhook
      summary: WhatsApp durum ve mesaj olayları
      description: >-
        `X-Hub-Signature-256` HMAC-SHA256 ile ve `crypto.timingSafeEqual` kullanılarak doğrulanır;
        algoritma istekten alınmaz. Hemen `200` döner, işleme kuyrukta yapılır, yinelenen olay ayıklanır.
      security: []
      x-roles: [public]
      x-phase: 10
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Alındı.
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '413': { $ref: './components/responses.yaml#/PayloadTooLarge' }

  # --- Administration ---------------------------------------------------------
  /tags:
    get:
      tags: [admin]
      operationId: listTags
      summary: Anahtar kelime / ilgi alanı sözlüğü
      x-roles: [student, advisor, admin]
      x-phase: 4
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '200':
          description: Etiketler (en fazla 100).
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/TagList' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
  /settings:
    get:
      tags: [admin]
      operationId: getSettings
      summary: Sistem ayarları
      x-roles: [admin]
      x-phase: 5
      responses:
        '200':
          description: Ayarlar.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Settings' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
    patch:
      tags: [admin]
      operationId: updateSettings
      summary: Ayarları değiştir (denetim kaydına yazılır)
      x-roles: [admin]
      x-phase: 5
      x-audited: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components/schemas.yaml#/SettingsUpdate' }
      responses:
        '200':
          description: Güncel ayarlar.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/Settings' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /audit-log:
    get:
      tags: [admin]
      operationId: listAuditLog
      summary: Denetim kaydı
      x-roles: [admin]
      x-phase: 3
      parameters:
        - name: action
          in: query
          schema: { type: string, maxLength: 80 }
        - $ref: './components/parameters.yaml#/Limit'
        - $ref: './components/parameters.yaml#/Cursor'
      responses:
        '200':
          description: Kayıtlar, en yeni önce.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/AuditPage' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /analytics/overview:
    get:
      tags: [admin]
      operationId: getAnalyticsOverview
      summary: Yönetici paneli göstergeleri
      description: Materialized view'lardan hesaplanır. Danışman yalnızca yetkili olduğu etkinlikleri görür.
      x-roles: [advisor, admin]
      x-phase: 11
      parameters:
        - $ref: './components/parameters.yaml#/SeasonName'
        - $ref: './components/parameters.yaml#/Category'
      responses:
        '200':
          description: Göstergeler.
          content:
            application/json:
              schema: { $ref: './components/schemas.yaml#/AnalyticsOverview' }
        '401': { $ref: './components/responses.yaml#/Unauthenticated' }
        '403': { $ref: './components/responses.yaml#/Forbidden' }
        '422': { $ref: './components/responses.yaml#/ValidationFailed' }
  /security-reports:
    post:
      tags: [admin]
      operationId: receiveSecurityReport
      summary: CSP ve Trusted Types ihlal raporları
      description: Tarayıcının Reporting API'si gönderir. Boyut ve hız sınırlıdır; içerik loglanır, saklanmaz.
      security: []
      x-roles: [public]
      x-phase: 3
      x-rate-limited: true
      requestBody:
        required: true
        content:
          application/reports+json:
            schema: { type: array, maxItems: 50, items: { type: object } }
          application/csp-report:
            schema: { type: object }
      responses:
        '204': { $ref: './components/responses.yaml#/NoContent' }
        '413': { $ref: './components/responses.yaml#/PayloadTooLarge' }
        '429': { $ref: './components/responses.yaml#/RateLimited' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Sunucu taraflı oturum (Redis). `Secure; HttpOnly; SameSite=Lax`.
