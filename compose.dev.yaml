# Local development overrides:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
# Datastore ports are published on 127.0.0.1 only. Keycloak stands in for the
# university identity provider (OIDC) during development.
services:
  api:
    environment:
      NODE_ENV: development

  worker:
    environment:
      NODE_ENV: development

  postgres:
    ports: ['127.0.0.1:5432:5432']

  redis:
    ports: ['127.0.0.1:6379:6379']

  garage:
    ports: ['127.0.0.1:3900:3900']

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ['start-dev', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    ports: ['127.0.0.1:8080:8080']
    security_opt: [no-new-privileges:true]
    networks: [edge]
