# Local development overrides:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
# Datastore ports are published on 127.0.0.1 only.
services:
  api:
    environment:
      NODE_ENV: development

  worker:
    environment:
      NODE_ENV: development

  postgres:
    ports: ['127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432']

  redis:
    ports: ['127.0.0.1:${DEV_REDIS_PORT:-6379}:6379']

  garage:
    ports: ['127.0.0.1:${DEV_GARAGE_PORT:-3900}:3900']

  keycloak:
    # Admin console for local development only: http://127.0.0.1:<DEV_KEYCLOAK_PORT>/idp/admin
    ports: ['127.0.0.1:${DEV_KEYCLOAK_PORT:-8080}:8080']
